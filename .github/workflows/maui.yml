name: MAUI

# Reactor for .NET MAUI (spec 065). Separate from ci.yml because these projects need the maui
# workload and build for Android, iOS and Mac Catalyst, which only macOS runners can do.

on:
  pull_request:
    paths: &maui-paths
      - 'src/Reactor.Core/**'
      - 'src/Reactor.Maui/**'
      - 'src/Reactor.Maui.Packaging.props'
      - 'tests/Reactor.Core.Tests/**'
      - 'tests/Reactor.Maui.Tests/**'
      - 'tests/Reactor.Maui.Benchmark/**'
      - 'tests/Reactor.Maui.DeviceTests/**'
      - 'samples/maui/**'
      - 'Reactor.Maui.slnx'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/maui.yml'
  push:
    branches: [main]
    paths: *maui-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # .NET 11 SDK builds (global.json); .NET 10 runtime runs the net10.0 core tests.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Select the newest Xcode
        # The iOS and Mac Catalyst workloads require a recent Xcode; the runner's default lags.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"

      - name: Install the maui workload
        run: dotnet workload install maui

      - name: Install Android dependencies
        run: >
          dotnet build src/Reactor.Maui/Reactor.Maui.csproj -f net11.0-android
          -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:AcceptAndroidSDKLicenses=True

      # Restored as Release: Release Mac Catalyst apps build for both x64 and arm64, and the
      # runtime identifiers are decided at restore time.
      - name: Restore
        run: dotnet restore Reactor.Maui.slnx -p:Configuration=Release

      - name: Core tests
        run: dotnet test tests/Reactor.Core.Tests/Reactor.Core.Tests.csproj --no-restore -c Release

      - name: Headless renderer tests
        run: dotnet test tests/Reactor.Maui.Tests/Reactor.Maui.Tests.csproj --no-restore -c Release

      - name: Build (Release, all platforms)
        run: dotnet build Reactor.Maui.slnx --no-restore -c Release

      - name: Pack
        run: |
          dotnet pack src/Reactor.Core/Reactor.Core.csproj --no-restore -c Release -o artifacts/packages
          dotnet pack src/Reactor.Maui/Reactor.Maui.csproj --no-restore -c Release -o artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maui-packages
          path: artifacts/packages
